<main class="page">
  <header class="header">
    <h1>RoadRescue Admin Panel</h1>
    <div class="action-group" *ngIf="isAdminAuthenticated">
      <button type="button" (click)="loadDashboardData()" [disabled]="isLoading">
        Refresh
      </button>
      <button type="button" class="secondary" (click)="logoutAdmin()">Logout</button>
    </div>
  </header>

  <p *ngIf="successMessage" class="message success">{{ successMessage }}</p>
  <p *ngIf="errorMessage" class="message error">{{ errorMessage }}</p>

  <section class="auth-card" *ngIf="!isAdminAuthenticated; else adminDashboard">
    <h2>Admin Login</h2>
    <form (ngSubmit)="loginAdmin()" #loginForm="ngForm">
      <label>
        Email
        <input name="adminEmail" [(ngModel)]="adminLogin.email" required type="email" />
      </label>
      <label>
        Password
        <input name="adminPassword" [(ngModel)]="adminLogin.password" required type="password" />
      </label>
      <button type="submit" [disabled]="isAuthenticating || loginForm.invalid">Login</button>
    </form>
  </section>

  <ng-template #adminDashboard>
    <section class="grid">
      <article class="card">
        <h2>Add User</h2>
        <form (ngSubmit)="addUser()" #userForm="ngForm">
          <label>
            User Name
            <input name="userName" [(ngModel)]="newUser.userName" required />
          </label>
          <label>
            Email
            <input name="email" [(ngModel)]="newUser.email" required type="email" />
          </label>
          <label>
            Password
            <input name="password" [(ngModel)]="newUser.password" required type="password" />
          </label>
          <button type="submit" [disabled]="isLoading || userForm.invalid">Add User</button>
        </form>
      </article>

      <article class="card">
        <h2>Add Provider</h2>
        <form (ngSubmit)="addProvider()" #providerForm="ngForm">
          <label>
            Provider Name
            <input name="serviceProviderName" [(ngModel)]="newProvider.serviceProviderName" required />
          </label>
          <label>
            Email
            <input name="providerEmail" [(ngModel)]="newProvider.email" required type="email" />
          </label>
          <label>
            Password
            <input name="providerPassword" [(ngModel)]="newProvider.password" required type="password" />
          </label>
          <label>
            Status
            <select name="providerStatus" [(ngModel)]="newProvider.status" required>
              <option *ngFor="let status of statusOptions" [value]="status">{{ status }}</option>
            </select>
          </label>
          <button type="submit" [disabled]="isLoading || providerForm.invalid">Add Provider</button>
        </form>
      </article>
    </section>

    <section class="table-card">
      <h2>Users</h2>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users">
            <td>
              <ng-container *ngIf="editingUserId === user._id; else userNameText">
                <input [(ngModel)]="editUserDraft.userName" [ngModelOptions]="{ standalone: true }" />
              </ng-container>
              <ng-template #userNameText>{{ user.userName }}</ng-template>
            </td>
            <td>
              <ng-container *ngIf="editingUserId === user._id; else userEmailText">
                <input
                  type="email"
                  [(ngModel)]="editUserDraft.email"
                  [ngModelOptions]="{ standalone: true }"
                />
              </ng-container>
              <ng-template #userEmailText>{{ user.email }}</ng-template>
            </td>
            <td>
              <div class="action-group" *ngIf="editingUserId === user._id; else userRowActions">
                <button type="button" (click)="saveUserEdit(user._id)">Save</button>
                <button type="button" class="secondary" (click)="cancelUserEdit()">Cancel</button>
              </div>
              <ng-template #userRowActions>
                <div class="action-group">
                  <button type="button" class="secondary" (click)="startUserEdit(user)">Edit</button>
                  <button type="button" class="danger" (click)="deleteUser(user.userName)">Delete</button>
                </div>
              </ng-template>
            </td>
          </tr>
          <tr *ngIf="users.length === 0">
            <td colspan="3">No users found.</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section class="table-card">
      <h2>Providers</h2>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let provider of providers">
            <td>{{ provider.serviceProviderName }}</td>
            <td>{{ provider.email }}</td>
            <td>
              <select
                [ngModel]="provider.status || 'pending'"
                [ngModelOptions]="{ standalone: true }"
                (ngModelChange)="updateProviderStatus(provider, $event)"
              >
                <option *ngFor="let status of statusOptions" [value]="status">{{ status }}</option>
              </select>
            </td>
            <td>
              <button type="button" class="danger" (click)="deleteProvider(provider.serviceProviderName)">
                Delete
              </button>
            </td>
          </tr>
          <tr *ngIf="providers.length === 0">
            <td colspan="4">No providers found.</td>
          </tr>
        </tbody>
      </table>
    </section>
  </ng-template>
</main>
